org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin embutido do AGP 9: todos os plugins Android usados já são compatíveis
# (o app não aplica mais o kotlin-android)
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# TEMPORÁRIO: o flutter_inappwebview_android 1.1.3 (última versão estável) usa
# getDefaultProguardFile('proguard-android.txt'), que o AGP 9 recusa. Remover
# quando sair uma versão estável corrigida (a opção some no AGP 10).
# https://github.com/pichillilorenzo/flutter_inappwebview/issues/2852
android.r8.proguardAndroidTxt.disallowed=false
